# Fly.io deploy skeleton. Run `fly launch --no-deploy` to register the app, then `fly deploy`.
app = "yt-saver-backend"
primary_region = "fra"

[build]

[env]
  FILES_DIR = "/data"
  FILE_TTL_SECONDS = "1800"
  MAX_DURATION_SECONDS = "1800"
  MAX_CONCURRENT_JOBS = "2"
  RATE_LIMIT_PER_HOUR = "10"
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "yt_saver_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
